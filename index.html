</main>

$('#prevBtn').onclick=()=>{if(index===0){$('#quiz').classList.add('hidden');$('#intro').classList.remove('hidden')}else{index--;renderQuestion()}};
$('#nextBtn').onclick=()=>{if(answers[index]===null){$('#quizError').classList.remove('hidden');return}if(index<14){index++;renderQuestion();scrollTo({top:0,behavior:'smooth'})}else calculate()};
function calculate(){const counts={稳:0,暖:0,趣:0,界:0,直:0,智:0};const ds={节奏:0,共情:0,边界:0,表达:0,长期:0};questions.forEach((q,i)=>{const tag=q.a[answers[i]][1];counts[tag]++;ds[q.d]+=({稳:88,暖:90,趣:86,界:84,直:87,智:89}[tag])});const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));const top=ranked[0][0],second=ranked[1][0],p=profile[top];const seed=answers.reduce((n,x,i)=>n+(x+1)*(i+3),0);const mbti=p.mbti[seed%p.mbti.length],z=p.z[(seed+counts[second])%p.z.length];const balance=ranked[0][1]-ranked.at(-1)[1];const score=Math.min(96,84+ranked[0][1]+Math.round((15-balance)/4));const picked=q=>questions[q].a[answers[q]][0];resultData={userName:$('#userNameInput').value.trim(),userAttr:`${$('#mbti').value} × ${$('#zodiac').value}`,targetType:`${mbti} × ${z}`,scoreNum:score,archetype:p.name,scoreLine:`你最看重“${p.name.replace('型','')}”，同时也需要${profile[second].name.replace('型','')}的加成。`,dims:Object.fromEntries(dims.map(d=>[d,Math.round(ds[d]/3)])),desc0:p.desc,desc1:`这不是凭空贴标签：你在“${picked(1)}”“${picked(8)}”等选择中，反复表现出对「${p.name.replace('型','')}」的偏好。`,desc2:`你们最容易卡住的地方，是把“${profile[second].name.replace('型','')}”当作理所当然。越重要的期待，越要说具体，而不是等对方猜。`,desc3:`下次约会试试：各自写下“最近最需要对方做的一件小事”，交换后只追问细节、不急着评价。你会更快确认这段关系是否真的舒服。`};saveAndRender()}
function renderResult(d){resultData=d;$('#displayName').textContent=d.userName;$('#targetType').textContent=d.targetType;$('#archetype').textContent=`你的心动原型：${d.archetype}`;$('#scoreNum').textContent=d.scoreNum;$('#scoreRing').style.setProperty('--pct',`${d.scoreNum}%`);$('#scoreLine').textContent=d.scoreLine;$('#meters').innerHTML=dims.map(x=>`<div class="meter"><b>${dimNames[x].slice(0,2)}</b><span><i style="height:${d.dims?.[x]||85}%"></i></span><small>${d.dims?.[x]||85}</small></div>`).join('');const blocks=[['💗 你真正会被什么打动',d.desc0],['🔎 为什么会得出这个结果',d.desc1],['⚠️ 你们可能的关系盲区',d.desc2],['✨ 一件立刻能做的小事',d.desc3]];$('#insights').innerHTML=blocks.map(x=>`<article class="insight"><h3>${x[0]}</h3><p>${esc(x[1])}</p></article>`).join('');$('#intro').classList.add('hidden');$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');showApp();scrollTo({top:0,behavior:'smooth'})}
async function saveAndRender(){const d=resultData;renderResult(d);if(client){try{await client.from('openlovetest').insert([{nickname:d.userName,mbti:$('#mbti').value,constellation:$('#zodiac').value,target_type:`${d.targetType} (${d.scoreNum}%)`,combined_result:`【关系原型】${d.archetype}\n【核心画像】${d.desc0}\n【结果依据】${d.desc1}\n【关系盲区】${d.desc2}\n【行动建议】${d.desc3}`,clicked_surprise:false}])}catch(e){}}}
function shareText(){return `${resultData.userName} 的心动关系画像是「${resultData.archetype}」\n最适合：${resultData.targetType}\n适配指数：${resultData.scoreNum}%\n\n${resultData.scoreLine}\n你也来测测：${location.href}`}
$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText(shareText());toast('结果文案已复制')};$('#shareBtn').onclick=async()=>{const data={title:'我的心动关系画像',text:shareText(),url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{$('#copyBtn').click()}};
$('#againBtn').onclick=()=>{answers.fill(null);index=0;resultData=null;$('#result').classList.add('hidden');$('#intro').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};
function boot(){showApp()}
boot();
</script>
</body>
</html>
