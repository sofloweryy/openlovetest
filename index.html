<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>💖 测测命中另一半的星座与MBTI</title>
<!-- 引入 Supabase 官方 SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary-gradient: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
  --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #f3e8ff 100%);
  --card-bg: #ffffff;
  --text-main: #2b2d42;
  --text-sub: #8d99ae;
  --accent-bg: #fff5f7;
  --border-color: #ffccd5;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-gradient);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 4px 16px 32px 16px;
  position: relative;
  overflow-x: hidden;
}

.romantic-header-art {
  position: relative;
  width: 100%;
  max-width: 500px;
  height: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px;
  pointer-events: none;
  margin-bottom: -2px;
}

.art-heart {
  width: 10px;
  height: 10px;
  background: #ff4d6d;
  transform: rotate(45deg);
  position: relative;
  animation: pulseGlow 2s ease-in-out infinite alternate;
  opacity: 0.7;
}

.art-heart::before,
.art-heart::after {
  content: '';
  width: 10px;
  height: 10px;
  background: #ff4d6d;
  border-radius: 50%;
  position: absolute;
}

.art-heart::before { left: -5px; top: 0; }
.art-heart::after { left: 0; top: -5px; }

.art-star {
  width: 12px;
  height: 12px;
  background: #ffb703;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  animation: starTwinkle 1.5s ease-in-out infinite alternate;
  opacity: 0.8;
}

.art-bubble {
  width: 16px;
  height: 10px;
  background: #ff758f;
  border-radius: 6px;
  position: relative;
  opacity: 0.5;
  animation: floatUp 3s ease-in-out infinite alternate;
}

.art-bubble::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 4px;
  width: 0;
  height: 0;
  border-left: 3px solid transparent;
  border-right: 3px solid transparent;
  border-top: 4px solid #ff758f;
}

@keyframes pulseGlow {
  0% { transform: rotate(45deg) scale(0.9); opacity: 0.5; }
  100% { transform: rotate(45deg) scale(1.15); opacity: 0.85; }
}

@keyframes starTwinkle {
  0% { transform: scale(0.8) rotate(0deg); opacity: 0.4; }
  100% { transform: scale(1.1) rotate(15deg); opacity: 0.9; }
}

@keyframes floatUp {
  0% { transform: translateY(2px); }
  100% { transform: translateY(-3px); }
}

.main-content {
  width: 100%;
  max-width: 500px;
}

.quiz-card {
  background: #ffffff;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 15px 35px rgba(255, 77, 109, 0.12);
  border: 2px solid #ffe5e9;
  position: relative;
}

h1 {
  font-size: 22px;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-top: 6px;
  margin-bottom: 6px;
  text-align: center;
  font-weight: 900;
  letter-spacing: 0.5px;
}

p.subtitle {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 20px;
  text-align: center;
  font-weight: 500;
}

.form-group {
  margin-bottom: 18px;
  text-align: left;
}

label.question-title {
  display: block;
  font-size: 14.5px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-main);
  line-height: 1.4;
}

input[type="text"], select {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border-color);
  border-radius: 14px;
  background-color: var(--accent-bg);
  font-size: 14.5px;
  color: var(--text-main);
  outline: none;
  font-weight: 600;
}

select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff4d6d' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 16px;
  padding-right: 40px;
}

.radio-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.radio-label {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background-color: var(--accent-bg);
  border: 1.5px solid var(--border-color);
  border-radius: 12px;
  cursor: pointer;
  font-size: 13.5px;
  color: #4a4e69;
  transition: all 0.2s;
  font-weight: 500;
  line-height: 1.4;
}

.radio-label:hover {
  background-color: #ffe3e8;
  border-color: #ff758f;
}

.radio-label input {
  accent-color: #ff4d6d;
  transform: scale(1.2);
}

button.submit-btn {
  width: 100%;
  padding: 16px;
  background: var(--primary-gradient);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 6px 20px rgba(255, 77, 109, 0.35);
  letter-spacing: 1px;
}

button.submit-btn:active { transform: scale(0.98); }

#result {
  margin-top: 0px;
  display: none;
}

.share-card {
  background: #ffffff;
  border-radius: 20px;
  padding: 14px 22px 22px 22px;
  box-shadow: 0 15px 35px rgba(255, 77, 109, 0.15);
  border: 2px solid #ffe5e9;
  position: relative;
}

.poster-header {
  text-align: center;
  margin-bottom: 14px;
  padding: 12px 12px;
  border: 2px solid #ffccd5;
  background: var(--accent-bg);
  border-radius: 16px;
}

.user-badge {
  font-size: 13px;
  color: #7a6570; 
  margin-bottom: 4px;
  font-weight: 500;
}
.user-badge span { 
  color: #594a52; 
  font-weight: bold; 
}

.match-target-label {
  font-size: 16px;
  color: #3a3845;
  font-weight: 800;
  margin: 4px 0 2px 0;
  letter-spacing: 0.5px;
}

.match-target-highlight {
  color: #ff4d6d;
  font-size: 19px;
  display: block;
  margin-top: 2px;
  font-weight: 900;
}

.score-badge {
  background: var(--accent-bg);
  border: 1.5px solid #ffccd5;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  margin-bottom: 16px;
}

.score-num { font-size: 24px; font-weight: 900; color: #ff4d6d; }
.score-sub { font-size: 12px; color: var(--text-sub); font-weight: 600; margin-top: 2px; }

.analysis-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
}

.analysis-item {
  background: #fff8f9;
  border-left: 4px solid #ff4d6d;
  border-radius: 0 12px 12px 0;
  padding: 12px 14px;
}

.item-title { font-size: 13.5px; font-weight: 800; color: #ff4d6d; margin-bottom: 4px; }
.item-desc { font-size: 13px; line-height: 1.5; color: #4a4e69; font-weight: 500; }

.poster-footer {
  padding-top: 14px;
  border-top: 1.5px dashed var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-brand {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  padding-left: 0;
}

.footer-brand .brand-name {
  font-size: 11px;
  font-weight: bold;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}
.footer-brand .footer-sub { 
  font-size: 10px; 
  color: #aaa; 
  margin-top: 2px; 
  font-weight: normal;
  white-space: nowrap;
}

.contact-btn {
  background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
  color: #fff;
  font-size: 11.5px;
  padding: 8px 14px;
  border-radius: 16px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  box-shadow: 0 3px 10px rgba(255, 77, 109, 0.3);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
  flex-shrink: 0;
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.retry-btn {
  background: #f1f2f6;
  color: #57606f;
  border: none;
  padding: 8px 14px;
  border-radius: 16px;
  font-size: 11.5px;
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
}

.qr-modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(5px);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}

.qr-card {
  background: #fff;
  padding: 28px 24px;
  border-radius: 20px;
  text-align: center;
  width: 85%;
  max-width: 310px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.qr-card h3 { font-size: 17px; color: #2b2d42; margin-bottom: 6px; }
.qr-card p { font-size: 12.5px; color: #8d99ae; margin-bottom: 16px; }

.wechat-box {
  background: #fff0f3;
  border: 1.5px dashed #ff4d6d;
  color: #ff4d6d;
  font-size: 17px;
  font-weight: 900;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 14px;
  user-select: all;
}

.close-btn {
  background: var(--primary-gradient);
  color: #fff;
  border: none;
  padding: 13px 24px;
  border-radius: 14px;
  font-weight: bold;
  font-size: 14.5px;
  cursor: pointer;
  width: 100%;
  box-shadow: 0 5px 15px rgba(255, 77, 109, 0.35);
}
</style>
</head>
<body>

<div class="romantic-header-art">
  <div class="art-heart"></div>
  <div class="art-bubble"></div>
  <div class="art-star"></div>
  <div class="art-heart"></div>
</div>

<div class="main-content" id="mainContainer">
  <div id="contentView">
    <div class="quiz-card" id="quizSection">
      <h1>💖 测测命中另一半的星座与MBTI</h1>
      <p class="subtitle">全息星盘与人格交叉矩阵测算（公开畅玩版）</p>

      <div class="form-group">
        <label class="question-title">你的姓名或昵称：</label>
        <input type="text" id="userNameInput" placeholder="请输入你的名字或昵称">
      </div>

      <div class="form-group">
        <label class="question-title">你的初始 MBTI 类型：</label>
        <select id="mbti">
          <option value="" disabled selected style="color: #999;">请选择你的 MBTI 类型</option>
          <option value="INTJ">INTJ 建筑师</option>
          <option value="INTP">INTP 逻辑学家</option>
          <option value="ENTJ">ENTJ 指挥官</option>
          <option value="ENTP">ENTP 辩论家</option>
          <option value="INFJ">INFJ 提倡者</option>
          <option value="INFP">INFP 调停者</option>
          <option value="ENFJ">ENFJ 主人公</option>
          <option value="ENFP">ENFP 竞选者</option>
          <option value="ISTJ">ISTJ 物流师</option>
          <option value="ISFJ">ISFJ 守卫者</option>
          <option value="ESTJ">ESTJ 总经理</option>
          <option value="ESFJ">ESFJ 执政官</option>
          <option value="ISTP">ISTP 鉴赏家</option>
          <option value="ISFP">ISFP 探险家</option>
          <option value="ESTP">ESTP 企业家</option>
          <option value="ESFP">ESFP 表演者</option>
        </select>
      </div>

      <div class="form-group">
        <label class="question-title">你的太阳星座：</label>
        <select id="zodiac">
          <option value="" disabled selected style="color: #999;">请选择你的太阳星座</option>
          <option value="白羊座">白羊座 (03.21 - 04.19)</option>
          <option value="金牛座">金牛座 (04.20 - 05.20)</option>
          <option value="双子座">双子座 (05.21 - 06.21)</option>
          <option value="巨蟹座">巨蟹座 (06.22 - 07.22)</option>
          <option value="狮子座">狮子座 (07.23 - 08.22)</option>
          <option value="处女座">处女座 (08.23 - 09.22)</option>
          <option value="天秤座">天秤座 (09.23 - 10.23)</option>
          <option value="天蝎座">天蝎座 (10.24 - 11.22)</option>
          <option value="射手座">射手座 (11.23 - 12.21)</option>
          <option value="摩羯座">摩羯座 (12.22 - 01.19)</option>
          <option value="水瓶座">水瓶座 (01.20 - 02.18)</option>
          <option value="双鱼座">双鱼座 (02.19 - 03.20)</option>
        </select>
      </div>

      <hr style="border: 0; border-top: 1.5px dashed var(--border-color); margin: 20px 0;">

      <!-- 15 道题目 -->
      <div class="form-group"><label class="question-title">1. 周末约会时，你更倾向于哪种行程安排？</label><div class="radio-group"><label class="radio-label"><input type="radio" name="q1" value="A"> 提前做足攻略，时间与路线安排得井井有条</label><label class="radio-label"><input type="radio" name="q1" value="B"> 确定一个目的地，到了之后随性走走逛逛</label><label class="radio-label"><input type="radio" name="q1" value="C"> 无所谓行程，只要能和对方粘在一起就好</label><label class="radio-label"><input type="radio" name="q1" value="D"> 各自在家看看书/玩游戏，晚一点再聚餐</label></div></div>
      <div class="form-group"><label class="question-title">2. 当你工作或学习遇到不顺心向对方倾诉时，你最希望：</label><div class="radio-group"><label class="radio-label"><input type="radio" name="q2" value="A"> 坚定地站在我这边，帮我吐槽排解情绪</label><label class="radio-label"><input type="radio" name="q2" value="B"> 冷静帮我分析原因，并给出具体的解决方案</label><label class="radio-label"><input type="radio" name="q2" value="C"> 带我去吃好吃的或散心，用行动转移注意力</label><label class="radio-label"><input type="radio" name="q2" value="D"> 静静倾听并拥抱我，给我充分的温柔共鸣</label></div></div>
      <div class="form-group"><label class="question-title">3. 两个人产生分歧或小争执时，你通常会：</label><div class="radio-group"><label class="radio-label"><input type="radio" name="q3" value="A"> 希望当场直截了当说清楚，不把情绪留到明天</label><label class="radio-label"><input type="radio" name="q3" value="B"> 先各自冷静一会儿，找时间列出事实理性讨论</label><label class="radio-label"><input type="radio" name="q3" value="C"> 顺应对方的态度，主动给个软话避免冲突</label><label class="radio-label"><input type="radio" name="q3" value="D"> 戴上耳机做自己的事，等双方都恢复理智再聊</label></div></div>
      <div class="form-group"><label class="question-title">4. 约会去网红餐厅排队需要等很长时间，你会：</label><div class="radio-group"><label class="radio-label"><input type="radio" name="q4" value="A"> 边排队边愉快聊天，把等待当成甜蜜的相处</label><label class="radio-label"><input type="radio" name="q4" value="B"> 果断换一家不需要等位的高品质餐厅，不浪费时间</label><label class="radio-label"><input type="radio" name="q4" value="C"> 取号后去附近买杯奶茶或逛街，时间到了再回来</label><label class="radio-label"><input type="radio" name="q4" value="D"> 听从对方的决定，对方想等就等、想换就换</label></div></div>
      <div class="form-group"><label class="question-title">5. 在日常陪伴中，你更看重哪种相处状态？</label><div class="radio-group"><label class="radio-label"><input type="radio" name="q5" value="A"> 两个人共享喜好，有聊不完的共同话题和理想</label><label class="radio-label"><input type="radio" name="q5" value="B"> 即使各自做不同的事情，呆在同个空间也感到舒服</label><label class="radio-label"><input type="radio" name="q5" value="C"> 定期有浪漫的仪式感和惊喜，保持感情热情</label><label class="radio-label"><input type="radio" name="q5" value="D"> 能互相帮助、在事业或生活上成为强有力的后盾</label></div></div>
      <div class="form-group"><label class="question-title">6. 对于恋爱中的“报备”与社交边界，你觉得：</label><div class="radio-group"><label class="radio-label"><input type="radio" name="q6" value="A"> 主动告知行程是给彼此安全感的基本方式</label><label class="radio-label"><input type="radio" name="q6" value="B"> 保持信任即可，不需要事无巨细地汇报个人空间</label><label class="radio-label"><input type="radio" name="q6" value="C"> 只要不和异性有过于亲密的单独互动，其他都自由</label><label class="radio-label"><input type="radio" name="q6" value="D"> 最好共享彼此的日程卡，这样方便安排重合的空闲时间</label></div></div>
      <div class="form-group"><label class="question-title">7. 挑选送给对方的生日礼物时，你更倾向于：</label><div class="radio-group"><label class="radio-label"><input type="radio" name="q7" value="A"> 实用性强、对方日常生活正需要的硬核物品</label><label class="radio-label"><input type="radio" name="q7" value="B"> 充满心意、有独特纪念意义或手工制作的礼物</label><label class="radio-label"><input type="radio" name="q7" value="C"> 带对方去体验一次高端SPA或旅行等浪漫记忆</label><label class="radio-label"><input type="radio" name="q7" value="D"> 直接询问对方想要什么，精准清空对方的购物车</label></div></div>
      <div class="form-group"><label class="question-title">8. 如果原定的出行计划因为天气或突发状况取消，你的反应是：</label><div class="radio-group"><label class="radio-label"><input type="radio" name="q8" value="A"> 快速调整，迅速找寻室内或备选的替代方案</label><label class="radio-label"><input type="radio" name="q8" value="B"> 顺其自然，干脆改在家里休息、看电影点外卖</label><label class="radio-label"><input type="radio" name="q8" value="C"> 会感到些许沮丧，需要对方及时安抚情绪</label><label class="radio-label"><input type="radio" name="q8" value="D"> 觉得没关系，正好利用空出来的这段时间处理个人琐事</label></div></div>

      merit: '纯爱天花板的无敌治愈：对方会把生活过成偶像剧，随时随地给你制造各种浪漫的小惊喜。你的每一个小情绪，他都能用眼泪和拥抱给你最完美的共情。',
      pitfall: '双鱼座有时会陷入不切实际的胡思乱想或小委屈中。当对方情绪泛滥时，不要用冰冷的逻辑去反驳，只要温柔地抱紧他并说“我在”就足够了。',
      suggestion: '在房间里铺上满地的气球和灯带，一起看一场温馨的童话动画片，让童心在成年人的世界里肆意生长。'
    }
  };

  function showQRCode() { document.getElementById('qrModal').style.display = 'flex'; }
  function hideQRCode() { document.getElementById('qrModal').style.display = 'none'; }

  function calculateMatch() {
    const userName = document.getElementById('userNameInput').value.trim();
    const mbti = document.getElementById('mbti').value;
    const zodiac = document.getElementById('zodiac').value;

    if (!userName) { alert('请先输入你的名字或昵称哦！'); return; }
    if (!mbti) { alert('请先选择你的 MBTI 类型哦！'); return; }
    if (!zodiac) { alert('请先选择你的太阳星座哦！'); return; }

    for (let i = 1; i <= 15; i++) {
      const radios = document.getElementsByName(`q${i}`);
      let answered = false;
      for (let r of radios) { if (r.checked) { answered = true; break; } }
      if (!answered) { alert(`还有未完成的题目哦！请检查第 ${i} 题。`); return; }
    }

    const mbtiObj = mbtiTargetMap[mbti] || mbtiTargetMap['ESTP'];
    const zodiacObj = zodiacFlavorMap[zodiac] || zodiacFlavorMap['双鱼座'];

    const randomScore = (Math.random() * (99.8 - 93.2) + 93.2).toFixed(1);
    const randomSubText = scoreSubPool[Math.floor(Math.random() * scoreSubPool.length)];

    const targetTypeStr = `${mbtiObj.type} × ${zodiacObj.trait}`;
    const fullResultString = `${targetTypeStr} (${randomScore}%)`;

    // 后台异步写入 Supabase
    (async () => {
      try {
        const { data, error } = await supabaseClient
          .from('openlovetest')
          .insert([
            { 
              nickname: userName, 
              mbti: mbti, 
              constellation: zodiac,
              combined_result: fullResultString 
            }
          ]);
          
        if (error) {
          console.error('Supabase 写入失败：', error.message);
        } else {
          console.log('数据成功写入 Supabase！', data);
        }
      } catch (err) {
        console.error('网络异常：', err);
      }
    })();

    document.getElementById('displayName').innerText = userName;
    document.getElementById('userAttr').innerText = `${mbti} × ${zodiac}`;
    document.getElementById('targetType').innerText = targetTypeStr;
    document.getElementById('scoreNum').innerText = randomScore + '%';
    document.getElementById('scoreSubText').innerText = randomSubText;
    
    document.getElementById('desc0').innerText = mbtiObj.baseDesc;
    document.getElementById('desc1').innerText = zodiacObj.merit;
    document.getElementById('desc2').innerText = `避坑小提醒：${zodiacObj.pitfall}`;
    document.getElementById('desc3').innerText = `互动温馨秘诀：${zodiacObj.suggestion}`;

    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetQuiz() {
    document.getElementById('quizSection').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
